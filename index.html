<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>K.P.M Store — Rental Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#EEF1F3; --surface:#FFFFFF; --surface-2:#F6F8F9;
    --ink:#1F2A33; --ink-soft:#4C5A63; --muted:#7C8A92; --line:#DDE3E6;
    --steel:#3F5A68; --steel-dark:#2C4048;
    --brass:#B8873B; --brass-dark:#96692B; --brass-light:#EFDDB8;
    --success:#2F9E58; --success-bg:#E4F5EA;
    --warning:#C97A0D; --warning-bg:#FBEEDA;
    --danger:#C7433F; --danger-bg:#FBE7E6;
    --whatsapp:#25A05A;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(31,42,51,0.06), 0 4px 14px rgba(31,42,51,0.06);
    --nav-h:64px; --topbar-h:56px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Tamil","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; padding-bottom:calc(var(--nav-h) + 14px);
  }
  h1,h2,h3,h4{margin:0 0 4px 0; font-weight:700; letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}

  #topbar{position:sticky; top:0; z-index:40; height:var(--topbar-h); background:var(--steel-dark); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 10px;}
  #topbar .left-group{display:flex; align-items:center; gap:8px; min-width:0;}
  #topbar .brand{display:flex; align-items:center; gap:9px; min-width:0;}
  #topbar .brand .mark{width:30px;height:30px;border-radius:8px;background:var(--brass);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#2C1E08;flex-shrink:0;}
  #topbar .brand .title{font-weight:700; font-size:15px; letter-spacing:0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #topbar .back-btn{background:rgba(255,255,255,0.12); border:none; color:#fff; width:32px;height:32px;border-radius:9px; font-size:18px; display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0;}
  #topbar .screen-title{font-weight:700; font-size:15px;}
  #topbar .right-group{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .lang-toggle{display:flex; background:rgba(255,255,255,0.12); border-radius:20px; padding:2px;}
  .lang-toggle button{background:none; border:none; color:#fff; font-size:11px; font-weight:700; padding:5px 8px; border-radius:16px; cursor:pointer; opacity:0.65;}
  .lang-toggle button.active{background:var(--brass); opacity:1;}
  .icon-btn{background:rgba(255,255,255,0.12); border:none; color:#fff; width:32px;height:32px;border-radius:9px; font-size:15px; display:flex;align-items:center;justify-content:center; cursor:pointer;}

  #offlineBanner{display:none; background:var(--danger); color:#fff; text-align:center; padding:7px; font-size:12.5px; font-weight:700;}
  #offlineBanner.show{display:block;}

  #bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:40; height:var(--nav-h); background:#fff; border-top:1px solid var(--line); display:flex; box-shadow:0 -2px 10px rgba(31,42,51,0.06);}
  #bottomnav button{flex:1; border:none; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--muted); font-size:10.5px; font-weight:600; padding:6px 2px;}
  #bottomnav button .ic{font-size:19px; line-height:1;}
  #bottomnav button.active{color:var(--brass-dark);}

  #app{max-width:640px; margin:0 auto; padding:14px;}
  .screen{display:none;}
  .screen.active{display:block; animation:fadein .15s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
  .section-label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin:18px 2px 8px;}
  .section-label:first-child{margin-top:2px;}

  .devo-header{text-align:center; padding:6px 0 16px;}
  .devo-header .shopname{font-size:22px; font-weight:800; color:var(--steel-dark); letter-spacing:-0.01em;}
  .devo-header .devo{font-size:10.5px; color:var(--muted); line-height:1.6; margin-top:4px; font-style:italic;}

  .tile-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tile{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 12px; text-align:left; border:none; cursor:pointer; display:flex; flex-direction:column; gap:8px; min-height:88px;}
  .tile .ic{font-size:23px;}
  .tile .lbl{font-weight:700; font-size:13.5px; color:var(--ink);}
  .tile.primary{background:linear-gradient(135deg, var(--brass) 0%, var(--brass-dark) 100%); color:#fff;}
  .tile.primary .lbl{color:#fff;}

  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:4px;}
  .stat{background:var(--surface); border-radius:var(--radius-sm); padding:12px; box-shadow:var(--shadow);}
  .stat .n{font-size:21px; font-weight:800;}
  .stat .l{font-size:11px; color:var(--muted); font-weight:600; margin-top:2px;}
  .stat.warn .n{color:var(--warning);}
  .stat.danger .n{color:var(--danger);}
  .stat.success .n{color:var(--success);}

  .alert{border-radius:var(--radius-sm); padding:11px 13px; font-size:13.5px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .alert.danger{background:var(--danger-bg); color:var(--danger);}
  .alert.warn{background:var(--warning-bg); color:var(--warning);}
  .alert.info{background:var(--surface-2); color:var(--ink-soft);}

  .btn{border:none; border-radius:11px; padding:13px 18px; font-weight:700; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
  .btn-block{width:100%;}
  .btn-brass{background:var(--brass); color:#fff;}
  .btn-brass:active{background:var(--brass-dark);}
  .btn-steel{background:var(--steel); color:#fff;}
  .btn-outline{background:#fff; color:var(--ink); border:1.5px solid var(--line);}
  .btn-success{background:var(--success); color:#fff;}
  .btn-whatsapp{background:var(--whatsapp); color:#fff;}
  .btn-danger-outline{background:#fff; color:var(--danger); border:1.5px solid var(--danger);}
  .btn-sm{padding:8px 12px; font-size:12.5px; border-radius:9px;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .field input[type=text], .field input[type=tel], .field input[type=number], .field input[type=email], .field input[type=password], .field input[type=date], .field textarea, .field select{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; font-size:15px; background:#fff; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass);}
  .field .hint{font-size:11.5px; color:var(--muted); margin-top:4px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .item-card{display:flex; gap:11px; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:11px; margin-bottom:10px; align-items:center;}
  .item-thumb{width:56px; height:56px; border-radius:10px; background:var(--surface-2); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:21px; overflow:hidden; color:var(--muted);}
  .item-thumb img{width:100%; height:100%; object-fit:cover;}
  .item-info{flex:1; min-width:0;}
  .item-info .nm{font-weight:700; font-size:14.5px;}
  .item-info .nmta{font-size:12px; color:var(--muted);}
  .item-info .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .item-info .stockline{display:flex; gap:8px; margin-top:5px; font-size:11px; font-weight:700; flex-wrap:wrap;}
  .item-info .stockline span{padding:2px 7px; border-radius:6px;}
  .stockline .tot{background:var(--surface-2); color:var(--ink-soft);}
  .stockline .avail{background:var(--success-bg); color:var(--success);}
  .stockline .rented{background:var(--warning-bg); color:var(--warning);}
  .stockline .zero{background:var(--danger-bg); color:var(--danger);}
  .stockline .inactive{background:var(--danger-bg); color:var(--danger);}

  .stepper{display:flex; align-items:center; gap:8px;}
  .stepper button{width:32px; height:32px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-size:17px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--steel);}
  .stepper button:active{background:var(--surface-2);}
  .stepper button:disabled{opacity:0.35;}
  .stepper .qty{min-width:24px; text-align:center; font-weight:800; font-size:15px;}

  .pick-card{display:flex; flex-direction:column; gap:9px; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:11px; margin-bottom:10px;}
  .pick-card.selected{outline:2px solid var(--brass);}
  .pick-top{display:flex; gap:11px; align-items:center;}
  .pick-card .price{font-size:12px; color:var(--muted); margin-top:2px;}
  .pick-card .avail-tag{font-size:11px; font-weight:700; color:var(--success); margin-top:2px;}
  .pick-card .avail-tag.low{color:var(--danger);}
  .pick-bottom{display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:9px;}
  .pick-bottom .lineamt{font-weight:800; font-size:13.5px; color:var(--brass-dark);}

  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:700; white-space:nowrap;}
  .badge.st-ACTIVE{background:var(--warning-bg); color:var(--warning);}
  .badge.st-PARTIALLY_RETURNED{background:var(--warning-bg); color:var(--warning);}
  .badge.st-COMPLETED{background:var(--success-bg); color:var(--success);}
  .badge.pay-PENDING{background:var(--danger-bg); color:var(--danger);}
  .badge.pay-PARTIALLY_PAID{background:var(--warning-bg); color:var(--warning);}
  .badge.pay-PAID{background:var(--success-bg); color:var(--success);}

  .rental-card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:13px; margin-bottom:10px; cursor:pointer;}
  .rental-card .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .rental-card .cust{font-weight:800; font-size:15px;}
  .rental-card .phone{font-size:12px; color:var(--muted); margin-top:1px;}
  .rental-card .meta{font-size:11.5px; color:var(--ink-soft); margin-top:7px; line-height:1.5;}
  .rental-card .items-line{font-size:12.5px; color:var(--ink-soft); margin-top:6px;}
  .rental-card .bottom-row{display:flex; justify-content:space-between; align-items:center; margin-top:9px; gap:6px; flex-wrap:wrap;}
  .rental-card .amt{font-weight:800; font-size:15px;}
  .rental-card .badges{display:flex; gap:5px; flex-wrap:wrap;}

  .empty-state{text-align:center; padding:40px 16px; color:var(--muted);}
  .empty-state .ic{font-size:34px; margin-bottom:8px;}
  .empty-state .t{font-weight:700; color:var(--ink-soft); margin-bottom:4px;}
  .empty-state .d{font-size:13px;}

  .search-box{position:relative; margin-bottom:10px;}
  .search-box input{width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 12px 11px 36px; font-size:14.5px;}
  .search-box .ic{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted);}
  .filter-chips{display:flex; gap:7px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
  .filter-chips button{flex-shrink:0; border:1.5px solid var(--line); background:#fff; padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .filter-chips button.active{background:var(--steel); border-color:var(--steel); color:#fff;}

  .divider{height:1px; background:var(--line); margin:12px 0;}

  .total-box{background:var(--steel-dark); color:#fff; border-radius:var(--radius); padding:16px; margin:14px 0;}
  .total-box .lbl{font-size:12px; opacity:0.8; font-weight:600;}
  .total-box .val{font-size:26px; font-weight:800; margin-top:2px;}
  .total-box .sub{font-size:12px; opacity:0.75; margin-top:4px;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(31,42,51,0.45); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
  .modal-backdrop.center{align-items:center; padding:16px;}
  .modal-sheet{background:#fff; width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); max-height:88vh; overflow-y:auto;}
  .modal-backdrop.center .modal-sheet{border-radius:16px; max-height:82vh;}
  .modal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .modal-header h3{font-size:17px;}
  .modal-close{background:var(--surface-2); border:none; width:30px;height:30px;border-radius:8px; font-size:16px; cursor:pointer; color:var(--ink-soft);}

  .photo-upload{width:100%; height:130px; border-radius:12px; border:1.5px dashed var(--line); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; color:var(--muted); margin-bottom:12px; overflow:hidden; position:relative;}
  .photo-upload img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .photo-upload .lbl{font-size:12.5px; font-weight:700;}

  .toast{position:fixed; bottom:calc(var(--nav-h) + 14px); left:50%; transform:translateX(-50%); background:var(--steel-dark); color:#fff; padding:11px 18px; border-radius:24px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .return-row{padding:11px 0; border-bottom:1px solid var(--line);}
  .return-row:last-child{border-bottom:none;}
  .return-row .nm{font-weight:700; font-size:14px;}
  .return-row .sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .return-row .ctrl{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .return-row .ctrl input{width:70px; border:1.5px solid var(--line); border-radius:9px; padding:8px; text-align:center; font-weight:700; font-size:14px;}
  .done-tag{color:var(--success); font-weight:700; font-size:12.5px; margin-top:6px; display:inline-block;}

  .bill-header{text-align:center; margin-bottom:14px;}
  .bill-header .shop{font-size:18px; font-weight:800;}
  .bill-header .billno{font-size:13px; color:var(--muted); margin-top:3px;}
  table.bill-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.bill-table th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted); padding:6px 4px; border-bottom:1.5px solid var(--line);}
  table.bill-table td{padding:8px 4px; border-bottom:1px solid var(--line);}
  table.bill-table td.num, table.bill-table th.num{text-align:right;}

  .balance-box{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .balance-box:last-child{border-bottom:none;}
  .balance-box .l{color:var(--ink-soft);}
  .balance-box .v{font-weight:800;}

  .report-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .report-row:last-child{border-bottom:none;}
  .report-row .l{color:var(--ink-soft);}
  .report-row .v{font-weight:800;}

  .qr-preview{width:100%; max-width:260px; margin:0 auto 12px; display:block; border-radius:12px; border:1.5px solid var(--line);}

  .login-wrap{min-height:calc(100vh - 40px); display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{width:100%; max-width:360px; background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:26px 22px;}
  .login-card .mark{width:52px; height:52px; border-radius:14px; background:var(--brass); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:#2C1E08; margin:0 auto 14px;}
  .login-card h2{text-align:center; margin-bottom:2px;}
  .login-card .devo{text-align:center; font-size:10.5px; color:var(--muted); line-height:1.6; margin-bottom:20px; font-style:italic;}

  .user-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .user-row:last-child{border-bottom:none;}
  .user-row .nm{font-weight:700; font-size:14px;}
  .user-row .meta{font-size:11.5px; color:var(--muted); margin-top:2px;}

  .chart-box{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
  .chart-box canvas{max-height:220px;}

  ::-webkit-scrollbar{width:0; height:0;}
  @media (min-width:520px){ .tile-grid{grid-template-columns:repeat(3,1fr);} }
</style>
</head>
<body>

<div id="offlineBanner"></div>
<div id="topbar" style="display:none;">
  <div class="left-group">
    <button class="back-btn" id="backBtn" style="visibility:hidden;" onclick="goBack()">‹</button>
    <div class="screen-title" id="screenTitle">K.P.M Store</div>
  </div>
  <div class="right-group">
    <div class="lang-toggle">
      <button id="langEnBtn" onclick="setLang('en')">EN</button>
      <button id="langTaBtn" onclick="setLang('ta')">தமிழ்</button>
    </div>
    <button class="icon-btn" title="Logout" onclick="handleLogout()">⏻</button>
  </div>
</div>

<div id="app">

  <!-- LOGIN -->
  <div class="screen" id="screen-login">
    <div class="login-wrap">
      <div class="login-card">
        <div class="mark">K</div>
        <h2 id="loginTitleShop">K.P.M Store</h2>
        <div class="devo" id="loginDevo"></div>
        <div class="field">
          <label id="lblEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label id="lblPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="loginError" style="color:var(--danger); font-size:12.5px; font-weight:600; margin-bottom:10px; display:none;"></div>
        <button class="btn btn-brass btn-block" id="loginBtn" onclick="handleLogin()">Login</button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="screen" id="screen-dashboard">
    <div class="devo-header">
      <div class="shopname" id="dashShopName">K.P.M Store</div>
      <div class="devo" id="dashDevo"></div>
    </div>
    <div id="dashAlerts"></div>
    <div class="stat-row" id="dashStats"></div>
    <div class="section-label" data-i18n="quick_actions">Quick Actions</div>
    <div class="tile-grid" id="dashTiles"></div>
  </div>

  <!-- ITEMS -->
  <div class="screen" id="screen-items">
    <button class="btn btn-brass btn-block" id="addItemBtn" onclick="openItemForm()">➕ Add New Item</button>
    <div class="section-label" id="allItemsLabel">All Items</div>
    <div id="itemsList"></div>
  </div>

  <!-- NEW RENTAL -->
  <div class="screen" id="screen-new-rental">
    <div class="section-label" id="step1Label">Step 1 — Select Items</div>
    <div id="pickItemsList"></div>
    <div class="section-label" id="step2Label">Step 2 — Customer Details</div>
    <div class="card">
      <div class="field">
        <label id="lblCustName">Customer Name *</label>
        <input type="text" id="nrName" placeholder="e.g. Murugan">
      </div>
      <div class="field">
        <label id="lblMobile">Mobile Number *</label>
        <input type="tel" id="nrMobile" placeholder="10-digit mobile" maxlength="10" inputmode="numeric">
      </div>
      <div class="field">
        <label id="lblAddress">Address / Area</label>
        <input type="text" id="nrAddress" placeholder="Optional">
      </div>
      <div class="field">
        <label id="lblNotes">Notes</label>
        <textarea id="nrNotes" placeholder="Optional notes"></textarea>
      </div>
    </div>
    <div class="total-box" id="nrTotalBox">
      <div class="lbl" id="estAmtLbl">TOTAL AMOUNT</div>
      <div class="val num">₹0</div>
      <div class="sub" id="estAmtSub">Select items to see total</div>
    </div>
    <button class="btn btn-brass btn-block" id="reviewBtn" onclick="goToReview()">Review Rental</button>
  </div>

  <!-- REVIEW RENTAL -->
  <div class="screen" id="screen-review">
    <div id="reviewContent"></div>
  </div>

  <!-- ACTIVE RENTALS -->
  <div class="screen" id="screen-active">
    <div class="search-box">
      <span class="ic">🔎</span>

}
function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function emptyState(ic,tt,d){ return `<div class="empty-state"><div class="ic">${ic}</div><div class="t">${tt}</div><div class="d">${d}</div></div>`; }
function showLoading(msg){ document.getElementById('loadingText').textContent = msg||t('loading'); document.getElementById('loadingOverlay').style.display='flex'; }
function hideLoading(){ document.getElementById('loadingOverlay').style.display='none'; }
function validMobile(m){ return /^[6-9]\d{9}$/.test((m||'').replace(/\D/g,'')); }
function waLink(mobile, text){
  let digits = (mobile||'').replace(/\D/g,'');
  if(digits.length===10) digits = '91'+digits;
  return `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
}
async function guardedAction(btn, fn){
  if(btn){ if(btn.disabled) return; btn.disabled = true; }
  try{ await fn(); }
  catch(e){ console.error(e); alert(e.message || 'Something went wrong. Please try again.'); }
  finally{ if(btn) btn.disabled = false; }
}

async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await onLoggedIn(session.user); }
  else { showLoginScreen(); }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_OUT'){ showLoginScreen(); }
  });
}
function showLoginScreen(){
  currentUser = null; currentProfile = null;
  document.getElementById('topbar').style.display='none';
  document.getElementById('bottomnav').style.display='none';
  SCREENS.forEach(s=>document.getElementById('screen-'+s)?.classList.remove('active'));
  document.getElementById('screen-login').classList.add('active');
  currentScreen = 'login';
  applyStaticI18n();
}
async function onLoggedIn(user){
  currentUser = user;
  const { data:profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(error || !profile || !profile.active){
    await sb.auth.signOut();
    alert('Your account is not active. Please contact your Admin.');
    showLoginScreen();
    return;
  }
  currentProfile = profile;
  document.getElementById('topbar').style.display='flex';
  document.getElementById('bottomnav').style.display='flex';
  applyStaticI18n();
  navStack = ['dashboard'];
  nav('dashboard', false);
}
async function handleLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display='none';
  if(!email || !password){ errEl.textContent='Please enter email and password'; errEl.style.display='block'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = t('saving');
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = t('login_btn');
  if(error){ errEl.textContent = error.message; errEl.style.display='block'; return; }
  await onLoggedIn(data.user);
}
async function handleLogout(){
  if(!confirm('Logout?')) return;
  await sb.auth.signOut();
  showLoginScreen();
}

function nav(screen, push=true){
  if(!currentUser && screen!=='login') return;
  SCREENS.forEach(s=>{ const el=document.getElementById('screen-'+s); if(el) el.classList.toggle('active', s===screen); });
  const titleMap = {
    dashboard:t('app_name'), items:t('manage_items'), 'new-rental':t('new_rental'), review:t('review_rental'),
    active:t('active_rentals'), detail:t('bill_no'), 'return-summary':t('return_items'), history:t('history'),
    reports:t('reports'), users:t('user_management'), settings:t('settings')
  };
  document.getElementById('screenTitle').textContent = titleMap[screen] || t('app_name');
  document.querySelectorAll('#bottomnav button').forEach(b=> b.classList.toggle('active', b.dataset.s===screen));
  document.getElementById('backBtn').style.visibility = NAV_SCREENS.includes(screen) ? 'hidden' : 'visible';
  if(push){ if(navStack[navStack.length-1]!==screen) navStack.push(screen); }
  currentScreen = screen;
  renderScreen(screen);
  window.scrollTo(0,0);
}
function goBack(){
  if(navStack.length>1){ navStack.pop(); nav(navStack[navStack.length-1], false); }
  else nav('dashboard', false);
}
function renderScreen(screen){
  if(screen==='dashboard') renderDashboard();
  else if(screen==='items') renderItems();
  else if(screen==='new-rental') renderNewRentalScreen();
  else if(screen==='review') renderReviewScreen();
  else if(screen==='active') renderActive();
  else if(screen==='detail') renderDetail();
  else if(screen==='return-summary') renderReturnSummary();
  else if(screen==='history') renderHistory();
  else if(screen==='reports') renderReports();
  else if(screen==='users') renderUsers();
  else if(screen==='settings') renderSettings();
}

async function loadItemsAndStock(includeInactive=false){
  const { data: items, error } = await sb.from('items').select('*').order('name');
  if(error) throw error;
  ITEMS_CACHE = includeInactive ? items : items.filter(i=>i.active);
  const { data: lines, error: e2 } = await sb.from('rental_items')
    .select('item_id, qty, received_qty, rentals!inner(rental_status)')
    .neq('rentals.rental_status', 'COMPLETED');
  if(e2) throw e2;
  OUTSTANDING_CACHE = {};
  (lines||[]).forEach(li=>{
    OUTSTANDING_CACHE[li.item_id] = (OUTSTANDING_CACHE[li.item_id]||0) + Math.max(0, li.qty - li.received_qty);
  });
  return items;
}
function availableQty(item){
  return Math.max(0, item.total_qty - (OUTSTANDING_CACHE[item.id]||0));
}

function handleItemPhotoSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  pendingItemPhotoFile = file;
  const reader = new FileReader();
  reader.onload = ev=>{ document.getElementById('itemPhotoUpload').innerHTML = `<img src="${ev.target.result}">`; };
  reader.readAsDataURL(file);
}
function resizeImageFile(file, maxDim){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } } else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>resolve(blob), 'image/jpeg', 0.7);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function saveItemForm(){
  const name = document.getElementById('itemNameInput').value.trim();
  const nameTa = document.getElementById('itemNameTaInput').value.trim();
  const qty = parseInt(document.getElementById('itemQtyInput').value);
  const price = parseFloat(document.getElementById('itemPriceInput').value);
  if(!name){ toast('Please enter item name'); return; }
  if(isNaN(qty) || qty<0){ toast('Please enter valid quantity'); return; }
  if(isNaN(price) || price<0){ toast('Please enter valid price'); return; }
  const btn = document.getElementById('saveItemBtn');
  btn.disabled = true; btn.textContent = t('saving');
  try{
    let photoUrl = editingItemId ? (ITEMS_CACHE.find(i=>i.id===editingItemId)||{}).photo_url : null;
    if(pendingItemPhotoFile){
      const blob = await resizeImageFile(pendingItemPhotoFile, 500);
      const path = `${Date.now()}_${uid()}.jpg`;
      const { error: upErr } = await sb.storage.from('item-photos').upload(path, blob, { contentType:'image/jpeg' });
      if(upErr) throw upErr;
      const { data: pub } = sb.storage.from('item-photos').getPublicUrl(path);
      photoUrl = pub.publicUrl;
    }
    if(editingItemId){
      const { error } = await sb.from('items').update({ name, name_ta:nameTa||null, total_qty:qty, price, photo_url:photoUrl }).eq('id', editingItemId);
      if(error) throw error;
    } else {
      const { error } = await sb.from('items').insert({ name, name_ta:nameTa||null, total_qty:qty, price, photo_url:photoUrl, active:true });
      if(error) throw error;
    }
    closeModal();
    toast('Item saved');
    renderItems();
  }catch(e){ alert(e.message); btn.disabled=false; btn.textContent = t('save_item'); }
}
async function toggleItemActive(itemId, makeActive){
  if(!makeActive && !confirm('Deactivate this item? It will be hidden from new rentals but history stays intact.')) return;
  showLoading();
  try{

    toast(makeActive?'Item activated':'Item deactivated');
    await renderItems();
  }catch(e){ alert(e.message); }
  hideLoading();
}

      const val = Math.max(0, Math.min(parseInt(inp.value)||0, parseInt(inp.dataset.pending)));
      // cumulative received = existing + newly entered — fetch existing from the row text is fragile,
      // so we recompute server-side using the delta approach: pass new cumulative via lookup
      lines.push({ rental_item_id: inp.dataset.line, add_qty: val });
    });
    // fetch current received_qty to compute new cumulative total
    const full = await fetchRentalFull(currentDetailId);
    const p_lines = lines.map(l=>{
      const line = full.lines.find(x=>x.id===l.rental_item_id);
      return { rental_item_id: l.rental_item_id, received_qty: (line?line.received_qty:0) + l.add_qty };
    }).filter(l=>l !== null);
    const { error } = await sb.rpc('record_return', { p_rental_id: currentDetailId, p_lines });
    if(error) throw error;
    toast('Return recorded');
    nav('return-summary');
  }catch(e){ alert(e.message); btn.disabled=false; btn.textContent=t('confirm_return'); }
}

========================================================= */
function renderReportChips(){
  const chips = [['today','today'],['week','this_week'],['month','this_month'],['all','all']];
  document.getElementById('reportRangeChips').innerHTML = chips.map(([v,k])=>
    `<button class="${reportRange===v?'active':''}" onclick="setReportRange('${v}')">${t(k)}</button>`
  ).join('');
}
function setReportRange(v){ reportRange=v; renderReports(); }
function rangeStart(range){
  const now = new Date();
  if(range==='today'){ const d=new Date(); d.setHours(0,0,0,0); return d; }
  if(range==='week'){ const d=new Date(); d.setDate(d.getDate()-7); return d; }
  if(range==='month'){ const d=new Date(now.getFullYear(), now.getMonth(), 1); return d; }
  return null;
}
async function renderReports(){
  renderReportChips();
  showLoading();
  const el = document.getElementById('reportsContent');
  try{
    let query = sb.from('rentals').select('*, rental_items(item_name, qty)');
    const start = rangeStart(reportRange);
    if(start) query = query.gte('rental_date', start.toISOString());
    const { data, error } = await query;
    if(error) throw error;
    const rentals = data||[];
    const totalAmount = rentals.reduce((s,r)=>s+r.total_amount,0);
    const totalReceived = rentals.reduce((s,r)=>s+r.amount_received,0);
    const totalOutstanding = totalAmount-totalReceived;
    const activeCount = rentals.filter(r=>r.rental_status!=='COMPLETED').length;
    const completedCount = rentals.filter(r=>r.rental_status==='COMPLETED').length;
    const pendingItems = rentals.reduce((s,r)=> s + (r.rental_status!=='COMPLETED' ? 0 : 0), 0); // placeholder, recomputed below
    let pendingItemsCount = 0;
    const itemCounts = {};
    rentals.forEach(r=>{ (r.rental_items||[]).forEach(li=>{ itemCounts[li.item_name]=(itemCounts[li.item_name]||0)+li.qty; }); });
    const topItems = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);

    const payCounts = { PAID:0, PARTIALLY_PAID:0, PENDING:0 };
    const statusCounts = { ACTIVE:0, PARTIALLY_RETURNED:0, COMPLETED:0 };
    rentals.forEach(r=>{ payCounts[r.payment_status]++; statusCounts[r.rental_status]++; });

    el.innerHTML = `
      <div class="stat-row">
        <div class="stat"><div class="n num">${rentals.length}</div><div class="l">Total Rentals</div></div>
        <div class="stat success"><div class="n num">${money(totalReceived)}</div><div class="l">Amount Received</div></div>
      </div>
      <div class="stat-row">
        <div class="stat warn"><div class="n num">${money(totalOutstanding)}</div><div class="l">Outstanding</div></div>
        <div class="stat"><div class="n num">${money(totalAmount)}</div><div class="l">Total Rental Amount</div></div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="n num">${activeCount}</div><div class="l">Active/Partial</div></div>
        <div class="stat success"><div class="n num">${completedCount}</div><div class="l">Completed</div></div>
      </div>

      <div class="section-label">Payment Status</div>
      <div class="chart-box"><canvas id="payChart"></canvas></div>

      <div class="section-label">Rental Status</div>
      <div class="chart-box"><canvas id="statusChart"></canvas></div>

      <div class="section-label">Most Rented Items</div>
      <div class="card">
        ${topItems.length===0?'<p style="color:var(--muted); font-size:13px;">No rentals in this range</p>':
          topItems.map(([name,qty])=>`<div class="report-row"><span class="l">${escapeHtml(name)}</span><span class="v num">${qty} units</span></div>`).join('')}
      </div>
    `;
    if(reportsChartPayments) reportsChartPayments.destroy();
    if(reportsChartRentals) reportsChartRentals.destroy();
    reportsChartPayments = new Chart(document.getElementById('payChart'), {
      type:'doughnut',
      data:{ labels:[t('paid'),t('partially_paid'),t('pending')], datasets:[{ data:[payCounts.PAID,payCounts.PARTIALLY_PAID,payCounts.PENDING], backgroundColor:['#2F9E58','#C97A0D','#C7433F'] }] },
      options:{ plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } } }
    });
    reportsChartRentals = new Chart(document.getElementById('statusChart'), {
      type:'doughnut',
      data:{ labels:[t('active_lbl'),t('partial'),t('completed')], datasets:[{ data:[statusCounts.ACTIVE,statusCounts.PARTIALLY_RETURNED,statusCounts.COMPLETED], backgroundColor:['#C97A0D','#B8873B','#2F9E58'] }] },
      options:{ plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } } }
    });
  }catch(e){ el.innerHTML = `<div class="alert danger">${e.message}</div>`; }
  hideLoading();
}

async function createUser(){
  const full_name = document.getElementById('newUserName').value.trim();
  const email = document.getElementById('newUserEmail').value.trim();
  const password = document.getElementById('newUserPassword').value;
  const role = document.getElementById('newUserRole').value;
  const errEl = document.getElementById('newUserError');
  errEl.style.display='none';
  if(!full_name || !email || !password){ errEl.textContent='Please fill all required fields'; errEl.style.display='block'; return; }
  if(password.length<6){ errEl.textContent='Password must be at least 6 characters'; errEl.style.display='block'; return; }
  const btn = document.getElementById('createUserBtn');
  btn.disabled=true; btn.textContent=t('saving');
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/create-user`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${session.access_token}`, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password, full_name, role })
    });
    const result = await resp.json();
    if(!result.success) throw new Error(result.error || 'Could not create user');
    closeModal();
    toast('User created');
    renderUsers();
  }catch(e){ errEl.textContent = e.message; errEl.style.display='block'; btn.disabled=false; btn.textContent=t('add_user'); }
}

async function handleQrUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  showLoading();
  try{
    const blob = await resizeImageFile(file, 500);
    const path = `qr_${Date.now()}.jpg`;
    const { error: upErr } = await sb.storage.from('shop-assets').upload(path, blob, { contentType:'image/jpeg', upsert:true });
    if(upErr) throw upErr;
    const { data: pub } = sb.storage.from('shop-assets').getPublicUrl(path);
    const { error } = await sb.from('shop_settings').update({ qr_image_url: pub.publicUrl }).eq('id',1);
    if(error) throw error;
    toast('QR code saved');
    renderSettings();
  }catch(e){ alert(e.message); }
  hideLoading();
}
function csvEscape(v){ v=String(v==null?'':v); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
function downloadCsv(filename, rows){
  const content = rows.map(row=>row.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([content], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
